name: Feature or Coin Request
description: Suggest an enhancement, new metric, or coin/exchange addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make CryptoNotch better? We would love to hear your feedback!
  - type: dropdown
    id: request_type
    attributes:
      label: Request Type
      options:
        - New Coin / Trading Pair
        - New Notch Metric or Statistic
        - UI / Animation Polish
        - New Exchange / Data Source
        - Other Feature
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Feature / Enhancement Description
      description: What would you like to see added or improved?
      placeholder: Describe the desired feature, why it is useful, and how you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought of?
    validations:
      required: false
